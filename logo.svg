<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Rich Luxury Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="75%" stop-color="#FDF0CD"/>
      <stop offset="100%" stop-color="#875E19"/>
    </linearGradient>

    <!-- Platinum Accent Gradient -->
    <linearGradient id="platGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B0B5BA"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7B8288"/>
    </linearGradient>

    <!-- Deep Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="50%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
  </defs>

  <!-- CREST EMBLEM -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield/Diamond Frame -->
    <polygon points="50,2 96,28 96,72 50,98 4,72 4,28" 
             fill="url(#shieldGrad)" 
             stroke="url(#goldGradient)" 
             stroke-width="2.5" 
             stroke-linejoin="round"/>
    
    <!-- Inner Filigree Bevel -->
    <polygon points="50,9 89,32 89,68 50,91 11,68 11,32" 
             fill="none" 
             stroke="url(#goldGradient)" 
             stroke-width="1" 
             stroke-opacity="0.6"/>

    <!-- Central Interlocking Monogram: M & B Diamond Motif -->
    <!-- Stylized Crown / Star At Top -->
    <polygon points="50,15 54,23 62,23 56,28 58,36 50,31 42,36 44,28 38,23 46,23" 
             fill="url(#goldGradient)"/>

    <!-- Geometric Faceted Diamond Body / Monogram -->
    <path d="M26,40 L40,40 L50,56 L60,40 L74,40 L74,75 L64,75 L64,52 L53,68 L47,68 L36,52 L36,75 L26,75 Z" 
          fill="url(#goldGradient)" 
          filter="url(#goldGlow)"/>

    <!-- Central Noir Accent Diamond Cut -->
    <polygon points="50,42 57,52 50,62 43,52" 
             fill="#08080A" 
             stroke="url(#platGradient)" 
             stroke-width="1.2"/>
  </g>

  <!-- TYPOGRAPHY WORDMARK -->
  <g transform="translate(130, 20)">
    <!-- Brand Title: MEN N BLACK -->
    <text x="0" y="44" 
          font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', 'Times New Roman', serif" 
          font-size="36" 
          font-weight="700" 
          letter-spacing="9" 
          fill="url(#goldGradient)">
      MEN <tspan fill="url(#platGradient)" font-weight="300" font-size="28">N</tspan> BLACK
    </text>

    <!-- Subtitle: Haute Joaillerie -->
    <text x="4" y="70" 
          font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-size="10.5" 
          font-weight="500" 
          letter-spacing="7" 
          fill="#D4AF37" 
          fill-opacity="0.85">
      HAUTE JOAILLERIE POUR HOMME
    </text>

    <!-- Decorative Gold Divider Line with Diamond Pip -->
    <line x1="2" y1="84" x2="330" y2="84" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="166,80 170,84 166,88 162,84" fill="url(#goldGradient)"/>
  </g>
</svg>
